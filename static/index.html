<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZED Terminal — TradingView Advanced Chart</title>
  <script>
    /* TEMP DEBUG: capture every error path the console tool may miss */
    window.__errs = [];
    window.addEventListener('error', function (e) {
      window.__errs.push('ERR: ' + (e.message || '') + ' @ ' + String(e.filename || '').slice(-40) + ':' + (e.lineno || ''));
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = r && (r.stack || r.message) ? (r.stack || r.message) : String(r);
      window.__errs.push('REJ: ' + String(msg).slice(0, 220));
    });
    (function () {
      var orig = console.error.bind(console);
      console.error = function () {
        try {
          window.__errs.push('CERR: ' + Array.prototype.map.call(arguments, function (x) {
            return typeof x === 'object' && x ? String(x.stack || x.message || JSON.stringify(Object(x))).slice(0, 180) : String(x).slice(0, 180);
          }).join(' | '));
        } catch (e) {}
        orig.apply(console, arguments);
      };
    })();
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Trebuchet MS', Roboto, Ubuntu, sans-serif;
    }

    /* Chart wrapper reserves the right 44px column for TV's widget-bar rail
       (TV parity — the widget bar sits outside the price scale, below the
       toolbar). The component itself fills the wrapper (its module forces
       inline width/height 100% on the host, so the wrapper does the inset). */
    #zed-chart-wrap {
      position: fixed;
      inset: 0 44px 0 0;
    }
    tv-advanced-chart {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ── Instant BUY / SELL pair (TV-parity, transparent) ── */
    /* Top strip, aside of the indicator legends: the legend stack anchors
       top-left (symbol info, Vol, studies) — the pair sits below TV's toolbar
       on the right, clear of legends and of the right price scale strip. */
    .tv-instant-trading-bar {
      position: fixed;
      top: 48px;
      right: 84px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      z-index: 25;
      user-select: none;
    }

    .tv-trade-button {
      background: transparent;
      border-radius: 4px;
      padding: 3px 12px;
      min-width: 68px;
      text-align: center;
      cursor: pointer;
      transition: all 0.12s ease;
      box-shadow: none;
    }
    .tv-trade-sell { border: 1px solid #f23645; color: #f23645; }
    .tv-trade-sell:hover { background: rgba(242, 54, 69, 0.08); }
    .tv-trade-sell:active { transform: scale(0.97); }
    .tv-trade-buy { border: 1px solid #2962ff; color: #2962ff; }
    .tv-trade-buy:hover { background: rgba(41, 98, 255, 0.08); }
    .tv-trade-buy:active { transform: scale(0.97); }

    .tv-trade-price {
      font-size: 11px;
      font-weight: 700;
      line-height: 1.25;
      font-variant-numeric: tabular-nums;
      color: #131722;
    }
    .tv-trade-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    /* ── TV widget-bar rail (right column, TradingView's own glyphs) ── */
    .tv-widget-rail {
      position: fixed;
      top: 48px;
      right: 0;
      bottom: 0;
      width: 44px;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 4px 0 10px;
      user-select: none;
    }
    .tv-rail-btn {
      width: 40px;
      height: 40px;
      flex: none;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #131722;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      cursor: pointer;
      transition: background 0.12s ease;
    }
    .tv-rail-btn:hover { background: #f0f3fa; }
    .tv-rail-btn.active { background: #e0e3eb; }
    .tv-rail-btn svg { width: 28px; height: 28px; display: block; pointer-events: none; }

    /* ── Symbol Overview launcher + panel ── */
    .tv-overview-fab {
      width: 28px;
      height: 28px;
      border: 1px solid #e0e3eb;
      border-radius: 4px;
      background: transparent;
      color: #131722;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: background 0.12s ease;
    }
    .tv-overview-fab:hover { background: #f0f3fa; }
    .tv-overview-fab svg { width: 20px; height: 20px; display: block; }

    .tv-overview-panel {
      position: fixed;
      top: 48px;
      right: 52px;   /* left of the 44px widget-bar rail */
      bottom: 8px;
      width: 500px;
      max-width: calc(100vw - 60px);
      background: #0F0F0F;
      border: 1px solid #2a2e39;
      border-radius: 8px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      z-index: 55;
      display: none;
      flex-direction: column;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Trebuchet MS', Roboto, Ubuntu, sans-serif;
    }
    .tv-overview-panel.open { display: flex; }
    .tv-overview-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      color: #d1d4dc;
      font-size: 13px;
      font-weight: 700;
    }
    .tv-overview-head svg { width: 18px; height: 18px; color: #d1d4dc; flex: none; }
    .tv-overview-head span { flex: 1; }
    .tv-overview-close {
      border: 0;
      background: transparent;
      color: #787b86;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .tv-overview-close:hover { background: rgba(255,255,255,0.08); color: #d1d4dc; }
    .tv-overview-body { position: relative; flex: 1; min-height: 0; }
    .tv-overview-body .tradingview-widget-container,
    .tv-overview-body .tradingview-widget-container__widget { width: 100%; height: 100%; }
    .tv-overview-copyright {
      padding: 4px 12px 8px;
      font-size: 10px;
      color: #787b86;
      background: #0F0F0F;
    }
    .tv-overview-copyright a { color: #2962ff; text-decoration: none; }
    .tv-overview-fallback {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #787b86;
      font-size: 12px;
      padding: 0 24px;
      text-align: center;
      pointer-events: none;
    }

    /* Account status pill removed on user request (2026-10-28). */

    .tv-toast {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: #131722;
      color: #ffffff;
      font-size: 12px;
      padding: 8px 16px;
      border-radius: 4px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 60;
      white-space: nowrap;
    }
    .tv-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

  <script type="text/javascript">
    'use strict';

    const DEFAULT_SYMBOL = 'BSE:SENSEX';
    const DEFAULT_PRICES = {
      'BSE:SENSEX': 73606.75,
      'NSE:NIFTY': 22350.10,
      'NSE:BANKNIFTY': 48220.55,
      'BSE:RELIANCE': 2860.40,
      'BSE:TCS': 2536.00,
      'BSE:INFY': 1165.00
    };

    let activeSymbol = DEFAULT_SYMBOL;

    /* Paper trading account (localStorage-persisted) */
    const LS_ACCOUNT = 'zedPaperAcct';
    let acct = { balance: 1000000.00, initialBalance: 1000000.00, qty: 0, symbol: DEFAULT_SYMBOL };
    try {
      const saved = JSON.parse(localStorage.getItem(LS_ACCOUNT) || 'null');
      if (saved && typeof saved.balance === 'number') {
        acct = { ...acct, ...saved, symbol: saved.symbol || DEFAULT_SYMBOL };
        activeSymbol = acct.symbol;
      }
    } catch (e) { /* fresh account */ }

    function persistAcct() {
      try { localStorage.setItem(LS_ACCOUNT, JSON.stringify({ ...acct, symbol: activeSymbol })); } catch (e) {}
    }

    function fmtPrice(v) {
      return v.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    let toastTimer = null;
    function showTvToast(text) {
      const toast = document.getElementById('tv-toast');
      if (!toast) return;
      toast.textContent = text;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
    }

    /* Internal quotes: bid/ask around last price. No DOM for spread/status —
       the bar renders only the SELL/BUY pair. */
    function refreshQuotes() {
      const last = DEFAULT_PRICES[activeSymbol] || 73606.75;
      const half = Math.max(0.025, +(last * 0.000005).toFixed(2));
      const bid = last - half;
      const ask = last + half;
      document.getElementById('tv-instant-sell-price').textContent = fmtPrice(bid);
      document.getElementById('tv-instant-buy-price').textContent = fmtPrice(ask);
      return { last, bid, ask };
    }

    function executeTrade(side) {
      const { last, bid, ask } = refreshQuotes();
      const price = side === 'BUY' ? ask : bid;
      const qty = 1;

      acct.qty += side === 'BUY' ? qty : -qty;
      if (side === 'BUY') acct.balance -= price * qty;
      else acct.balance += price * qty;
      persistAcct();
      refreshQuotes();

      const pnl = acct.balance + (acct.qty * last) - acct.initialBalance;
      const pnlSign = pnl >= 0 ? '+' : '';
      showTvToast(`Paper ${side}: ${qty} ${activeSymbol} @ ₹${fmtPrice(price)} | P&L: ${pnlSign}₹${fmtPrice(pnl)}`);
    }

    document.getElementById('tv-instant-sell').addEventListener('click', () => executeTrade('SELL'));
    document.getElementById('tv-instant-buy').addEventListener('click', () => executeTrade('BUY'));

    /* ── Symbol Overview (embed-widget-symbol-overview) behind a TV glyph ──
       Opened on click; mounts lazily once. Config is user-supplied verbatim,
       with the current chart symbol prepended to the symbols list. */
    const S3_EMBED = 'https://s3.tradingview.com/external-embedding/embed-widget-';
    let overviewMounted = false;

    function currentChartSymbol() {
      const wc = document.querySelector('#tradingview_advanced_chart > tv-advanced-chart');
      return wc ? (wc.getAttribute('symbol') || DEFAULT_SYMBOL) : DEFAULT_SYMBOL;
    }

    function chartIntervalToken() {
      const wc = document.querySelector('#tradingview_advanced_chart > tv-advanced-chart');
      const iv = wc ? (wc.getAttribute('interval') || 'D') : 'D';
      // tv-advanced-chart stores "1D"-style tokens; the overview widget wants D/W/M
      return /^[0-9]+$/.test(iv) ? iv : iv.replace(/^1(?=[DWM]$)/, '');
    }

    function mountSymbolOverview() {
      if (overviewMounted) return;
      overviewMounted = true;

      const sym = currentChartSymbol().replace('|', ':') || DEFAULT_SYMBOL;
      const iv = chartIntervalToken();
      const shortName = sym.indexOf(':') > -1 ? sym.split(':').slice(1).join(':') : sym;
      const symbols = [
        [shortName, sym + '|' + iv],
        ['Apple', 'NASDAQ:AAPL|1D'],
        ['Google', 'NASDAQ:GOOGL|1D'],
        ['Microsoft', 'NASDAQ:MSFT|1D']
      ];

      var cfg = {
        lineWidth: 2,
        lineType: 0,
        chartType: 'area',
        fontColor: 'rgb(106, 109, 120)',
        gridLineColor: 'rgba(242, 242, 242, 0.06)',
        volumeUpColor: 'rgba(34, 171, 148, 0.5)',
        volumeDownColor: 'rgba(247, 82, 95, 0.5)',
        backgroundColor: '#0F0F0F',
        widgetFontColor: '#DBDBDB',
        upColor: '#22ab94',
        downColor: '#f7525f',
        borderUpColor: '#22ab94',
        borderDownColor: '#f7525f',
        wickUpColor: '#22ab94',
        wickDownColor: '#f7525f',
        colorTheme: 'dark',
        isTransparent: false,
        locale: 'en',
        chartOnly: false,
        scalePosition: 'right',
        scaleMode: 'Normal',
        fontFamily: '-apple-system, BlinkMacSystemFont, Trebuchet MS, Roboto, Ubuntu, sans-serif',
        valuesTracking: '1',
        changeMode: 'price-and-percent',
        symbols: symbols,
        dateRanges: ['1d|1', '1m|30', '3m|60', '12m|1D', '60m|1W', 'all|1M'],
        fontSize: '10',
        headerFontSize: 'medium',
        autosize: true,
        width: '100%',
        height: '100%',
        noTimeScale: false,
        hideDateRanges: false,
        hideMarketStatus: false,
        hideSymbolLogo: false
      };

      const cont = document.querySelector('#tv-overview-body .tradingview-widget-container');
      const s = document.createElement('script');
      s.src = S3_EMBED + 'symbol-overview.js';
      s.type = 'text/javascript';
      s.async = true;
      s.innerHTML = JSON.stringify(cfg);
      cont.appendChild(s);

      /* Courtesy attribution (TV embed guidelines) + offline fallback */
      document.getElementById('tv-overview-copyright').innerHTML =
        `<a href="https://www.tradingview.com/" rel="noopener nofollow" target="_blank">Charts by TradingView</a>`;
      const fb = document.createElement('div');
      fb.className = 'tv-overview-fallback';
      fb.textContent = 'Loading Symbol Overview… (unavailable while offline — reopen the panel once connected)';
      cont.appendChild(fb);
      var tries = 0;
      const t = setInterval(() => {
        const iframe = cont.querySelector('iframe');
        const ok = iframe && iframe.src && iframe.src.indexOf('tradingview') > -1 && iframe.getBoundingClientRect().height > 8;
        if (ok) {
          clearInterval(t);
          if (fb.parentNode) fb.parentNode.removeChild(fb);
          return;
        }
        if (++tries === 30 && fb.parentNode) fb.textContent = 'TradingView embed unavailable right now — check connectivity, then close and reopen this panel.';
        if (tries > 300) clearInterval(t);
      }, 500);
    }

    const overviewPanel = document.getElementById('tv-overview-panel');
    const overviewFab = document.getElementById('tv-overview-fab');

    function setOverviewOpen(v) {
      overviewPanel.classList.toggle('open', v);
      overviewFab.setAttribute('aria-expanded', v ? 'true' : 'false');
      /* Rail sync: the layers (Watchlist) glyph shows TV's active state while open */
      const wlBtn = document.querySelector('.tv-rail-btn[data-panel="overview"]');
      if (wlBtn) wlBtn.classList.toggle('active', v);
      if (v) mountSymbolOverview();
    }

    overviewFab.addEventListener('click', () => setOverviewOpen(!overviewPanel.classList.contains('open')));
    document.getElementById('tv-overview-close').addEventListener('click', () => setOverviewOpen(false));
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && overviewPanel.classList.contains('open')) setOverviewOpen(false);
    });

    /* ── Widget-bar rail: TV glyphs, TV click semantics ──
       Watchlist (layers) toggles the Symbol Overview panel; the rest are
       launcher slots for the engines decided in the plan (Agents, World
       Monitor, Research, Calendar, Feed, Alerts, Chat, Engines, Help). */
    document.querySelectorAll('.tv-rail-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        if (btn.dataset.panel === 'overview') {
          setOverviewOpen(!overviewPanel.classList.contains('open'));
          return;
        }
        showTvToast(btn.dataset.name + ' — panel wiring comes next');
      });
    });

    /* Keyboard: Alt+B buy, Alt+S sell (matches button tooltips) */
    document.addEventListener('keydown', (e) => {
      if (!e.altKey) return;
      const k = (e.key || '').toLowerCase();
      if (k === 'b') { e.preventDefault(); executeTrade('BUY'); }
      else if (k === 's') { e.preventDefault(); executeTrade('SELL'); }
    });

    /* Boot */
    persistAcct();
    refreshQuotes();
  </script>
</body>
</html>

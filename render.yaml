# Render Blueprint for Trading Workspace & Trading Journal (`suna/` monorepo)
# Single-container Free-tier setup (512 MB RAM, 0.1 CPU): runs memory-lean Bun API
# (`--smol`, `src/trading/lean-server.ts`) alongside Next.js standalone (`max-old-space-size=192`).
# Configure the secret Supabase/DB env vars (`sync: false`) in the Render Dashboard.
services:
  - type: web
    name: zed-workspace
    runtime: node
    plan: free
    region: virginia
    branch: main
    rootDir: suna
    healthCheckPath: /v1/health
    buildCommand: >-
      (command -v bun >/dev/null 2>&1 || (export BUN_INSTALL="$PWD/.bun" && curl -fsSL https://bun.sh/install | bash)) &&
      (command -v pnpm >/dev/null 2>&1 || npm install -g pnpm@10) &&
      pnpm install --frozen-lockfile &&
      NODE_OPTIONS="--max-old-space-size=400" NEXT_TELEMETRY_DISABLED=1 pnpm --filter Kortix-Computer-Frontend build &&
      mkdir -p apps/web/.next/standalone/apps/web/.next apps/web/.next/standalone/apps/web/public &&
      cp -R apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static &&
      cp -R apps/web/public/. apps/web/.next/standalone/apps/web/public/
    startCommand: >-
      BUN_BIN="$(command -v bun || echo "$PWD/.bun/bin/bun")";
      (cd apps/api && PORT=8008 "$BUN_BIN" --smol --no-env-file --max-http-header-size=65536 run src/trading/lean-server.ts) &
      i=0;
      while [ "$i" -lt 30 ]; do
        if node -e "fetch('http://127.0.0.1:8008/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then break; fi;
        i=$((i+1));
        sleep 1;
      done;
      PORT="${PORT:-10000}" HOSTNAME=0.0.0.0 NODE_OPTIONS="--max-old-space-size=192" exec node apps/web/.next/standalone/apps/web/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: INTERNAL_KORTIX_ENV
        value: prod
      - key: KORTIX_WORKERS_ENABLED
        value: "false"
      - key: TUNNEL_ENABLED
        value: "false"
      - key: KORTIX_MODEL_PRICING_LIVE_ENABLED
        value: "0"
      - key: KORTIX_MODEL_CATALOG_LIVE_ENABLED
        value: "0"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: BACKEND_URL
        value: http://127.0.0.1:8008/v1
      - key: KORTIX_API_PROXY_TARGET
        value: http://127.0.0.1:8008
      - key: NEXT_PUBLIC_BACKEND_URL
        value: /v1
      - key: NEXT_PUBLIC_BILLING_ENABLED
        value: "false"
      - key: NEXT_PUBLIC_DISABLE_LANDING_PAGE
        value: "false"
      - key: FRONTEND_URL
        value: https://zed-workspace.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        value: https://zed-workspace.onrender.com
      - key: NEXT_PUBLIC_URL
        value: https://zed-workspace.onrender.com
      - key: KORTIX_URL
        value: https://zed-workspace.onrender.com
      - key: API_KEY_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
